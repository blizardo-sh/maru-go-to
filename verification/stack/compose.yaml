services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: stack_probe
      POSTGRES_DB: stack_compat
      POSTGRES_PASSWORD: ${STACK_PROBE_DB_PASSWORD:?Set a disposable test password}
    ports:
      - "127.0.0.1:55436:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack_probe -d stack_compat"]
      interval: 2s
      timeout: 3s
      retries: 20
