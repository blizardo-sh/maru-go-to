name: Stack compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: verification/stack
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: stack_probe
          POSTGRES_DB: stack_compat
          POSTGRES_PASSWORD: compatibility-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stack_probe -d stack_compat"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      STACK_PROBE_DATABASE_URL: postgres://stack_probe:compatibility-only@127.0.0.1:5432/stack_compat
      STACK_PROBE_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run migrations
      - run: bun test --timeout 20000
      - run: bun run build
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run browser
