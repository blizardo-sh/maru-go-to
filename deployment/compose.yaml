name: japanese-learning
services:
  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    restart: unless-stopped
    environment:
      POSTGRES_DB: japanese_learning
      POSTGRES_USER: japanese_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set a separate runtime database password}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U japanese_admin -d japanese_learning']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 128
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    image: ${API_IMAGE:?Build the api image outside the VPS and set API_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set PostgreSQL URL with db hostname and encoded password}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random secret of at least 32 characters}
      APP_URL: ${APP_URL:?Set public HTTPS origin}
      HOST: 0.0.0.0
      PORT: '3000'
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      ANALYSIS_URL: ${ANALYSIS_URL:-}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-}
      ANALYSIS_API_KEY: ${ANALYSIS_API_KEY:-}
      ANALYSIS_FREE_ONLY: ${ANALYSIS_FREE_ONLY:-}
    expose: ['3000']
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 384m
    pids_limit: 128
    logging: *logging
    healthcheck:
      test: [CMD, bun, -e, 'const r=await fetch("http://127.0.0.1:3000/ready");process.exit(r.ok?0:1)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  web:
    image: ${WEB_IMAGE:?Build the web image outside the VPS and set WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports: ['127.0.0.1:8081:8080']
    user: '1000:1000'
    read_only: true
    tmpfs: [/tmp, /data, /config]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  postgres:
