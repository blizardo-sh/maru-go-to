name: japanese-learning
services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: japanese_learning
      POSTGRES_USER: japanese
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U japanese -d japanese_learning']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
  api:
    image: ${API_IMAGE:?Build the api image outside the VPS and set API_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set PostgreSQL URL with db hostname and encoded password}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random secret of at least 32 characters}
      APP_URL: ${APP_URL:?Set public HTTPS origin}
      HOST: 0.0.0.0
      PORT: '3000'
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      ANALYSIS_URL: ${ANALYSIS_URL:-}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-}
      ANALYSIS_API_KEY: ${ANALYSIS_API_KEY:-}
      ANALYSIS_FREE_ONLY: ${ANALYSIS_FREE_ONLY:-}
    expose: ['3000']
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, bun, -e, 'const r=await fetch("http://127.0.0.1:3000/ready");process.exit(r.ok?0:1)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  web:
    image: ${WEB_IMAGE:?Build the web image outside the VPS and set WEB_IMAGE}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set public hostname}
    depends_on:
      api:
        condition: service_healthy
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt: [no-new-privileges:true]
volumes:
  postgres:
  caddy_data:
  caddy_config:
