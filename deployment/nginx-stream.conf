stream {
    map $ssl_preread_server_name $japanese_upstream {
        __DOMAIN__ 127.0.0.1:9443;
        default 127.0.0.1:443;
    }
    server {
        listen __PUBLIC_IPV4__:443;
        listen [::]:443 ipv6only=on;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $japanese_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
