upstream japanese_staging_origin {
    server 147.45.221.220:8445;
    keepalive 8;
}
limit_req_zone $binary_remote_addr zone=japanese_staging_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=japanese_staging_api:1m rate=10r/s;
server {
    listen 4443 ssl http2;
    server_name 94.103.2.98;
    ssl_certificate /root/cert/ip/fullchain.pem;
    ssl_certificate_key /root/cert/ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    access_log off;
    client_max_body_size 64k;
    client_body_timeout 15s;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass https://japanese_staging_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name outboundserver.freemyip.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 94.103.2.98:4443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 40s;
        location /api/ {
            proxy_pass https://japanese_staging_origin;
            limit_req zone=japanese_staging_api burst=40 nodelay;
            location ~ ^/api/(auth/sign-in/email|invitations/(details|accept)|recovery/complete)$ {
                proxy_pass https://japanese_staging_origin;
                limit_req zone=japanese_staging_auth burst=10 nodelay;
            }
        }
    }
    location = /ready { deny all; }
}
