upstream japanese_staging_api_backend {
    server 127.0.0.1:8082;
    keepalive 8;
}
server {
    listen 8445 ssl;
    server_name outboundserver.freemyip.com;
    ssl_certificate /root/cert/outboundserver.freemyip.com/fullchain.pem;
    ssl_certificate_key /root/cert/outboundserver.freemyip.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 94.103.2.98;
    allow 127.0.0.1;
    deny all;
    access_log off;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    client_max_body_size 64k;
    location / {
        proxy_pass http://japanese_staging_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 94.103.2.98:4443;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 40s;
    }
    location = /ready { deny all; }
}
