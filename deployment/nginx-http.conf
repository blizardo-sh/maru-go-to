limit_req_zone $binary_remote_addr zone=japanese_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=japanese_api:1m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/japanese-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://__DOMAIN__$request_uri; }
}
server {
    listen 127.0.0.1:9443 ssl proxy_protocol;
    server_name __DOMAIN__;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    ssl_certificate /root/cert/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /root/cert/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 15s;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    # Authentication URLs contain no bearer tokens; queries and referrers stay out of logs.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 40s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            limit_req zone=japanese_api burst=40 nodelay;
            location ~ ^/api/(auth/sign-in/email|invitations/(details|accept)|recovery/complete)$ {
                proxy_pass http://127.0.0.1:8081;
                limit_req zone=japanese_auth burst=10 nodelay;
            }
        }
        location = /ready { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8081; }
    }
}
